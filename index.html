<!DOCTYPE html>

<head>
    <title>Parthenon title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background index">
        <!--if we have time, maybe add a small animation in the background??-->
        <!--background image here -->
        <div id="start-button">Start!</div>
        <div class="button" id="room1button">room 1!</div>
        <div class="button" id="room2button">room 2!</div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var startButton = document.getElementById("start-button");
            var room1button = document.getElementById("room1button");
            var room2button = document.getElementById("room2button");

            if (startButton) {
                startButton.addEventListener('click', function() {
                    window.location.href = "intro.html";
                });
                room1button.addEventListener('click', function() {
                    window.location.href = "room1.html";
                });
                room2button.addEventListener('click', function() {
                    window.location.href = "room2.html";
                });
            }
        });
    </script>
</body>
