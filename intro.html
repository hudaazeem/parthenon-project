<!--this is for the beginning, where pigeon steals the picture-->

<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <title>Intro</title>
    </head>
    <body>
        <div class="background intro" id="backgroundIntro">
            <div id="characterTalking"></div>
            <div id="pigeonFlapping"></div>
            <div id="speechBubble">
                Hey I'm Audrey. I became an orphan when I was 13, and the last thing from my parents was... wait. Wait. Is that a pigeon up there? WAIT.
            </div>
        
            <div class="button" id="nextSpeech">Next</div>
            
        </div>
    </body>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var backgroundIntro = document.getElementById("backgroundIntro");
            var nextSpeech = document.getElementById("nextSpeech");
            var pigeonFlapping = document.getElementById("pigeonFlapping"); 
            var characterTalking = document.getElementById("characterTalking"); 
            var speechBubble = document.getElementById("speechBubble"); 
            var clicks = 0;
            nextSpeech.addEventListener("click", function() {
                if (clicks == 0) {
                    clicks++;
                    characterTalking.style.backgroundImage = "url('/imgs/characterShocked.png')";
                    speechBubble.innerHTML = "HOLD ON. That pigeon stole the last photo I have of my family! I MUST catch that flipping pigeon... I'm gonna see where he's going...";
                } else if (clicks == 1) {
                    clicks++;
                    backgroundIntro.style.backgroundImage = "url('/imgs/apartmentBackground1.png')";
                    characterTalking.style.backgroundImage = "url('/imgs/character.png')";
                    speechBubble.innerHTML = "Hmm... looks like I have to enter this building...";
                    speechBubble.style.height = "30px";
                    pigeonFlapping.style.display = "none";
                    nextSpeech.innerHTML = "Enter";
                } else if (clicks == 2) {
                    clicks++;
                    window.location.href = "transition1.html";
                }

            })
        })
    </script>
</html>
